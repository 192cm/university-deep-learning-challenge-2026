[program:t5-external-cot]
command=/workspace/scripts/run_t5_external_cot.sh
directory=/workspace
autostart=false
autorestart=false
startsecs=1
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PROC_NAME="t5-external-cot"
