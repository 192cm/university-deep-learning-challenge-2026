[program:t11b-smoke]
environment=PROC_NAME="%(program_name)s"
command=/workspace/scripts/supervisor_t11b.sh smoke
autostart=false
autorestart=false
startsecs=1
startretries=0
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:t11b-generate]
environment=PROC_NAME="%(program_name)s"
command=/workspace/scripts/supervisor_t11b.sh teacher-generate
autostart=false
autorestart=false
startsecs=1
startretries=0
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
