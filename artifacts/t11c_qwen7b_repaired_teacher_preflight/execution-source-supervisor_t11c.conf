[program:t11c-all]
environment=PROC_NAME="%(program_name)s"
command=/workspace/scripts/supervisor_t11c.sh all
autostart=false
autorestart=false
startsecs=1
startretries=0
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

